
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Hero · Click Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🎨 CLICK HERO</h1>
        <p class="subtitle">¡Haz clic sobre los colores cuando estén en la zona!</p>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div class="info-panel">
            <div class="score">Puntos: <span id="scoreValue">0</span></div>
            <div class="lives">❤️ <span id="livesValue">5</span></div>
        </div>

        <!-- Leyenda de colores (opcional) -->
        <div class="color-legend">
            <div class="legend-item" style="background: #FF4D4D;">Rojo</div>
            <div class="legend-item" style="background: #4DFF4D;">Verde</div>
            <div class="legend-item" style="background: #4DA6FF;">Azul</div>
            <div class="legend-item" style="background: #FFE64D;">Amarillo</div>
        </div>

        <button class="restart-btn" id="restartButton">🔄 Reiniciar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
