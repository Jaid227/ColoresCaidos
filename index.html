<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Hero · Personalizable</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🎨 COLOR HERO</h1>
        <p class="subtitle">¡Toca los colores en la zona!</p>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div class="info-panel">
            <div class="score">Puntos: <span id="scoreValue">0</span></div>
            <div class="lives">❤️ <span id="livesValue">10</span></div>
        </div>

        <!-- CONTROLES PERSONALIZABLES -->
        <div class="controls-panel">
            <div class="control-item">
                <label for="colorCount">🎯 Colores: <span id="colorCountValue">50</span></label>
                <input type="range" id="colorCount" min="50" max="500" value="50" step="1">
                <div class="range-labels">
                    <span>50</span>
                    <span>500</span>
                </div>
            </div>

            <div class="control-item">
                <label for="speed">⚡ Velocidad: <span id="speedValue">2.2</span></label>
                <input type="range" id="speed" min="0.2" max="5.0" value="2.2" step="0.1">
                <div class="range-labels">
                    <span>0.2</span>
                    <span>5.0</span>
                </div>
            </div>
        </div>

        <!-- Leyenda de colores -->
        <div class="color-legend">
            <div class="legend-item" style="background: #FF4D4D;">Rojo</div>
            <div class="legend-item" style="background: #4DFF4D;">Verde</div>
            <div class="legend-item" style="background: #4DA6FF;">Azul</div>
            <div class="legend-item" style="background: #FFE64D;">Amarillo</div>
        </div>

        <button class="restart-btn" id="restartButton">🔄 Reiniciar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
